<!doctype html>
<html>
  <head>
    <title>Goita tu</title>
    <link href="../fonts/fonts.css" rel="stylesheet" />
    <link href="../fonts/fontawesome/solid.css" rel="stylesheet" />
    <link href="../fonts/fontawesome/fontawesome.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="radial-menu">
      <div class="radial">
        <i href="" class="fa-solid fa-arrow-up" data-handler="arrow"></i>
        <i href="" class="fa-solid fa-square" data-handler="rect"></i>
        <i href="" class="fa-solid fa-highlighter" data-handler="highlight"></i>
        <i href="" class="fa-solid fa-i-cursor" data-handler="text"></i>
        <i href="" class="fa-solid fa-circle" data-handler="ellipse"></i>
        <i href="" class="fa-solid fa-icons" data-handler="memes"></i>
      </div>
      <input type="text" id="hidden-input" />
    </div>
    <div id="screenshotContainer">
      <div id="sourceLink"></div>
      <svg id="svgOverlay"></svg>
      <img id="screenshotImg" />
    </div>
    <div id="filter-text"></div>
    <div id="filtered-memes"></div>
    <script src="../libs/interact.min.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
